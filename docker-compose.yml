version: '3.8'

services:
  deltax-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
      # Add your environment variables here or use .env file
    env_file:
      - Codebase/.env.local
    restart: unless-stopped
    container_name: deltax-landing

  # Development service with hot reload
  deltax-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
    env_file:
      - Codebase/.env.local
    volumes:
      - ./Codebase:/app/Codebase
      - /app/Codebase/node_modules
      - /app/Codebase/.next
    restart: unless-stopped
    container_name: deltax-landing-dev
    profiles:
      - dev
